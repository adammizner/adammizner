name: Update Status Banner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"adammizner\") { status { message emoji indicatesLimitedAvailability } } }"}')

          echo "$RESPONSE"

          MESSAGE=$(echo "$RESPONSE" | jq -r '.data.user.status.message // empty')
          EMOJI=$(echo "$RESPONSE" | jq -r '.data.user.status.emoji // empty')
          LIMITED=$(echo "$RESPONSE" | jq -r '.data.user.status.indicatesLimitedAvailability // false')

          if [ -z "$MESSAGE" ] && [ -z "$EMOJI" ] && [ "$LIMITED" != "true" ]; then
            echo "STATE=available" >> $GITHUB_ENV
          else
            echo "STATE=busy" >> $GITHUB_ENV
          fi

      - name: Swap banner
        run: |
          if [ "$STATE" = "available" ]; then
            cp available.png status-banner.png
          else
            cp busy.png status-banner.png
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add status-banner.png

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update status banner"
          git push