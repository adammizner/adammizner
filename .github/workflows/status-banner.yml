name: Update Status Banner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query { user(login: \\\"adammizner\\\") { status { message emoji indicatesLimitedAvailability } } }\"}")

          echo "API RESPONSE:"
          echo "$RESPONSE"

          EMOJI=$(echo "$RESPONSE" | jq -r '.data.user.status.emoji // empty')

          echo "EMOJI=$EMOJI"

          if [ -z "$EMOJI" ]; then
            STATE=available
          else
            STATE=busy
          fi

          echo "STATE=$STATE"
          echo "STATE=$STATE" >> $GITHUB_ENV

      - name: Swap banner image
        run: |
          if [ "$STATE" = "available" ]; then
            cp available.png status-banner.png
          else
            cp busy.png status-banner.png
          fi

      - name: Commit changes (only if needed)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add status-banner.png

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update status banner"
          git push
