name: Update Status Banner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch GitHub status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"adammizner\") { status { message emoji indicatesLimitedAvailability } } }"}')

          echo "$RESPONSE"

          MESSAGE=$(echo "$RESPONSE" | jq -r '.data.user.status.message // empty')
          EMOJI=$(echo "$RESPONSE" | jq -r '.data.user.status.emoji // empty')
          LIMITED=$(echo "$RESPONSE" | jq -r '.data.user.status.indicatesLimitedAvailability // false')

          echo "MESSAGE=$MESSAGE" >> $GITHUB_ENV
          echo "EMOJI=$EMOJI" >> $GITHUB_ENV

      - name: Swap banner
        run: |

          echo "MESSAGE=$MESSAGE"
          echo "EMOJI=$EMOJI"

          # Normalize
          EMOJI=$(echo "$EMOJI" | tr -d '\r\n' | xargs)
          MESSAGE=$(echo "$MESSAGE" | tr -d '\r\n' | xargs)

          echo "NORMALIZED EMOJI=[$EMOJI]"
          echo "NORMALIZED MESSAGE=[$MESSAGE]"

          if [ -z "$EMOJI" ] && [ -z "$MESSAGE" ]; then
            cp available.png status-banner.png

          elif [[ "$EMOJI" == *studio_microphone* ]] || [[ "$MESSAGE" == *Recording* ]]; then
            cp recording.png status-banner.png

          elif [[ "$EMOJI" == *headphones* ]] || [[ "$MESSAGE" == *Mixing* ]]; then
            cp mixing.png status-banner.png

          elif [[ "$EMOJI" == *video_game* ]] || [[ "$MESSAGE" == *Designing* ]]; then
            echo "GAMEDEV MATCHED"
            cp gamedev.png status-banner.png

          elif [[ "$EMOJI" == *airplane* ]] || [[ "$MESSAGE" == *Away* ]]; then
            cp away.png status-banner.png

          else
            cp busy.png status-banner.png
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status-banner.png

          echo "---- GIT STATUS ----"
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update status banner"
          git push